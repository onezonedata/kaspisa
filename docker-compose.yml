# Сервисы для локальной разработки. Пароли здесь только для локальной базы.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kaspisa
      POSTGRES_PASSWORD: kaspisa
      POSTGRES_DB: kaspisa
    ports:
      - "127.0.0.1:${KASPISA_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaspisa"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${KASPISA_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
